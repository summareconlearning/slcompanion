<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Summarecon Learning — What's New · Rapat Kerja</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{--page:#FFFFFF;--ink:#121212;--muted:#8D8A97;--soft:#F3F3F6;--line:#E7E6EC}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
.d{font-weight:800;letter-spacing:-.04em;line-height:1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
svg{display:block;overflow:visible}
img{display:block;max-width:100%}
.mode{position:fixed;inset:0}
.a{opacity:0;transform:translateY(24px)}
.in .a,.slide.on .a{animation:up .7s cubic-bezier(.2,1,.3,1) forwards;animation-delay:calc(var(--i,0)*80ms + 60ms)}
@keyframes up{to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes blink{50%{opacity:1}}
.bob{width:100%;height:100%;animation:bob var(--fd,5s) ease-in-out infinite}
.flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:60;animation:flash .5s ease-out forwards}
@keyframes flash{0%{opacity:0}15%{opacity:.95}100%{opacity:0}}
@keyframes shake{0%{transform:translate(0,0)}10%{transform:translate(-2px,1px) rotate(-.5deg)}20%{transform:translate(3px,-1px) rotate(.7deg)}30%{transform:translate(-4px,2px) rotate(-1deg)}40%{transform:translate(5px,-2px) rotate(1.3deg)}50%{transform:translate(-7px,3px) rotate(-1.7deg) scale(1.01)}60%{transform:translate(8px,-3px) rotate(2.1deg) scale(1.02)}70%{transform:translate(-10px,4px) rotate(-2.7deg) scale(1.03)}80%{transform:translate(11px,-4px) rotate(3.1deg) scale(1.05)}90%{transform:translate(-12px,5px) rotate(-3.5deg) scale(1.07)}100%{transform:scale(1.1)}}
.shake{animation:shake .75s cubic-bezier(.4,0,.6,1) forwards!important;opacity:1}
.boom{animation:boom .35s cubic-bezier(.5,0,1,.5) forwards!important}
@keyframes boom{0%{transform:scale(1.1);opacity:1}40%{transform:scale(1.25);filter:brightness(2);opacity:1}100%{transform:scale(0);opacity:0}}
.pt{position:absolute;left:0;top:0;will-change:transform}
.pt img{width:100%;height:100%;object-fit:contain}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;background:#121212;color:#fff;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:#00BC36}
.tag.new::before{background:#FF65C6}.tag.soon::before{background:#F6BA00}
.go{border-radius:50%;display:grid;place-items:center;flex:none}
.go svg{width:45%;height:45%}
.gchip{display:inline-flex;align-items:center;gap:6px;background:var(--gm);border-radius:99px;padding:3px 10px 3px 3px;font-size:12px;font-weight:700;white-space:nowrap}
.gchip img{width:22px;height:22px;border-radius:50%;background:#fff;object-fit:cover}

/* thumbnails (16:9) */
.th{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;container-type:inline-size;background:#222}
.th>img{width:100%;height:100%;object-fit:cover}
.fill .th{height:100%;aspect-ratio:auto}
.th.ph{background:radial-gradient(circle at 78% 70%,#fff8 0,transparent 55%),var(--gm)}
.th.ph::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,#ffffff1f 0 14px,transparent 14px 28px)}
.ph-g{position:absolute;right:3%;bottom:-4%;height:100%;width:auto!important;object-fit:contain}
.ph-t{position:absolute;left:6%;bottom:10%;width:56%;font-weight:800;font-size:8.2cqw;line-height:1;letter-spacing:-.03em;color:var(--gd)}
.ph-k{position:absolute;left:6%;top:9%;font-size:3.4cqw;font-weight:800;background:#fff;border-radius:99px;padding:.8cqw 2.4cqw;color:#121212;letter-spacing:.06em}

/* guardian lineup */
.lineup{position:absolute;left:0;right:0;bottom:0;height:var(--lh,220px);pointer-events:none;overflow:hidden}
.lu{position:absolute;bottom:-4%;height:94%;width:16%;display:flex;justify-content:center;transform:translateY(115%)}
.lu img{height:100%;width:auto;max-width:none;object-fit:contain}
.in .lu,.slide.on .lu,.lineup.static .lu{animation:rise 1s cubic-bezier(.3,1.5,.5,1) forwards;animation-delay:calc(var(--d)*80ms + 300ms)}
.lineup.static .lu{animation-duration:0s;animation-delay:0s}
@keyframes rise{to{transform:none}}

/* ====================== COMPANION ====================== */
#companion{background:#000}
#c-bg{position:fixed;inset:0;background:var(--page);clip-path:circle(0 at var(--x,50%) var(--y,50%))}
#c-bg.open{clip-path:circle(160vmax at var(--x,50%) var(--y,50%));transition:clip-path 1s cubic-bezier(.7,0,.2,1)}
#c-bg.now{clip-path:none}
#c-fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.cs{position:fixed;inset:0;z-index:3;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.hint{color:#9a96a6;font-size:13px;margin-top:18px;text-align:center;min-height:18px;transition:opacity .3s;font-weight:500}

/* lock screen + notif */
#c-lock{justify-content:flex-start;padding-top:calc(64px + env(safe-area-inset-top));color:#fff}
.lk-lock{width:18px;height:18px;opacity:.8;margin-bottom:10px}
.lk-date{font-size:17px;font-weight:600;opacity:.8;text-transform:capitalize}
.lk-time{font-size:86px;font-weight:700;letter-spacing:-.04em;line-height:1;margin:2px 0 44px}
.nt-wrap{position:relative;width:min(92vw,380px);animation:drop .9s .5s cubic-bezier(.2,1.35,.4,1) both;cursor:pointer}
@keyframes drop{from{transform:translateY(-70vh);opacity:0}}
.nt-wrap::after{content:"";position:absolute;left:14px;right:14px;bottom:-9px;height:30px;border-radius:0 0 22px 22px;background:rgba(244,243,248,.35);z-index:-1}
.nt{display:flex;gap:12px;align-items:flex-start;background:rgba(246,245,250,.97);color:var(--ink);border-radius:24px;padding:14px 16px 15px 14px;text-align:left}
.nt-ic{width:42px;height:42px;border-radius:11px;background:#fff;padding:5px 4px;flex:none;box-shadow:0 0 0 1px #0000000d}
.nt-b{flex:1;min-width:0}
.nt-top{display:flex;align-items:baseline;gap:8px}
.nt-top b{font-size:14px;font-weight:800;letter-spacing:-.01em}
.nt-top em{margin-left:auto;font-style:normal;font-size:12px;color:#7d7a86;font-weight:500}
.nt-t{font-size:15px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.nt-s{font-size:14px;color:#55525e;font-weight:500;line-height:1.35;margin-top:1px}
.nt-wrap.out{animation:ntOut .4s cubic-bezier(.6,0,.4,1) forwards}
@keyframes ntOut{to{transform:translateY(-30px) scale(.9);opacity:0}}
.lk-bar{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;width:134px;height:5px;border-radius:5px;background:#fff;opacity:.7;transform:translateX(-50%)}

/* login (concept 2) */
.lg{width:min(88vw,350px);background:#fff;border-radius:36px;padding:30px 22px 24px;animation:pop .55s cubic-bezier(.2,1.3,.4,1) both}
.lg>img{width:200px;margin:0 auto 8px}
.lg>p{text-align:center;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:20px}
.fd{display:flex;align-items:center;gap:12px;height:58px;border-radius:18px;background:var(--soft);padding:0 9px;margin-bottom:10px;border:2px solid transparent;transition:.25s;font-weight:700;font-size:15px}
.fd .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--fc);flex:none}
.fd .ic svg{width:19px;height:19px}
.fd .val{white-space:nowrap;overflow:hidden;letter-spacing:.02em}
.fd .caret{width:2px;height:20px;background:#121212;opacity:0;flex:none}
.fd.focus{border-color:#121212;background:#fff}
.fd.focus .caret{animation:blink 1s steps(1) infinite}
#btn-login{position:relative;width:100%;height:60px;margin-top:22px;border-radius:99px;background:#121212;color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 24px;isolation:isolate}
#btn-login .go{width:44px;height:44px;background:#fff;color:#121212}
#btn-login::before{content:"";position:absolute;inset:-5px;border-radius:99px;background:linear-gradient(90deg,#00BC36,#F6BA00,#F67900,#FF464F,#FF65C6,#983BA6,#0070CB,#00BC36);background-size:200% 100%;filter:blur(14px);opacity:0;z-index:-1;transition:opacity .4s}
#btn-login::after{content:"";position:absolute;inset:-3px;border-radius:99px;background:inherit;z-index:-1}
#btn-login.glow::before{opacity:1;animation:hue 2.2s linear infinite}
#btn-login.glow{animation:breath 1.5s ease-in-out infinite}
@keyframes hue{to{background-position:200% 0}}
@keyframes breath{50%{transform:scale(1.035)}}

/* app screens */
.wrap{max-width:480px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px 120px;min-height:100%;position:relative}
.hd{display:flex;align-items:center;justify-content:space-between}
.hd>img{height:44px}
.av{width:48px;height:48px;border-radius:50%;background:var(--soft);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.h1{font-size:34px;margin:22px 0 16px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:4px 18px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.mchip{flex:none;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:99px;padding:5px 15px 5px 5px;font-size:13px;font-weight:700}
.mchip img{width:32px;height:32px;border-radius:50%;background:#fff;object-fit:cover}
.bento{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}
.tile{position:relative;text-align:left;background:var(--gm);border-radius:26px;padding:14px;min-height:236px;overflow:hidden;display:flex;flex-direction:column}
.tl-h{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;position:relative;z-index:1}
.tl-h img{width:26px;height:26px}
.tl-n{font-size:68px;margin-top:auto;position:relative;z-index:1}
.tl-s{font-size:13px;font-weight:700;opacity:.75;position:relative;z-index:1}
.tl-c{font-size:12px;font-weight:600;line-height:1.35;margin-top:8px;background:#ffffffb8;border-radius:12px;padding:8px 10px;position:relative;z-index:1}
.tl-g{position:absolute;right:-18px;top:28px;height:118px;width:auto;max-width:none;transform:rotate(-6deg)}
.poll{background:var(--gm);border-radius:26px;padding:16px;margin-top:10px}
.poll-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800}
.poll-h span{opacity:.55}
.pq{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:10px 0 14px}
.poll-b{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.poll-b button{height:46px;border-radius:14px;background:#121212;color:#fff;font-weight:700}
.poll-done{display:flex;align-items:center;gap:14px;font-weight:800;font-size:16px;padding:4px 0;margin-top:10px}
.poll-done img{width:58px;height:58px;flex:none}
.sec{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:24px 0 10px}
.foot{position:relative;margin:34px -18px -120px;height:250px;overflow:hidden}
.foot p{text-align:center;font-weight:800;font-size:22px;letter-spacing:-.03em}
.foot small{display:block;text-align:center;color:var(--muted);font-size:12px;font-weight:600;margin-top:4px}
.foot .lineup{--lh:150px}

#tabs{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10;display:flex;gap:4px;background:#fff;border-radius:99px;padding:6px;box-shadow:0 12px 30px rgba(20,20,40,.16),0 0 0 1px #00000008}
#tabs.show{animation:tabsIn .5s .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes tabsIn{from{transform:translate(-50%,100px)}}
#tabs button{width:58px;height:48px;border-radius:99px;display:grid;place-items:center;color:#8d8a97;transition:.25s}
#tabs button.on{background:#121212;color:#fff}
#tabs svg{width:21px;height:21px}

.tb{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.rb{width:46px;height:46px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.rb svg{width:18px;height:18px}
.rb.img{padding:0;overflow:hidden;background:var(--gm)}
.rb.img img{width:100%;height:100%;object-fit:cover}
.tb-t{flex:1;text-align:center;min-width:0}
.tb-t b{display:block;font-size:17px;font-weight:800}
.tb-t small{font-size:12px;color:var(--muted);font-weight:600}
.cnt{height:46px;padding:0 16px;border-radius:99px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.calw{background:var(--soft);border-radius:26px;padding:14px}
.calw h5{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:12px}
.calw h5 span{color:var(--muted);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ct{text-align:center;min-width:0}
.ct-f{aspect-ratio:1;border-radius:18px;background:var(--gm);overflow:hidden;transition:transform .15s;display:grid;place-items:end center}
.ct-f img{width:88%;height:88%;object-fit:contain;object-position:bottom}
.ct:active .ct-f{transform:scale(.94)}
.ct small{display:block;font-size:11px;font-weight:700;margin-top:6px;line-height:1.2}
.sum{position:relative;background:var(--gm);border-radius:26px;padding:16px;margin-top:10px;overflow:hidden;min-height:150px}
.sum small{font-size:13px;font-weight:800;opacity:.65}
.sum .d{font-size:42px;margin:8px 0 6px;position:relative}
.sum p{font-size:13px;font-weight:600;width:62%;opacity:.8;line-height:1.4;position:relative}
.sum>img{position:absolute;right:6px;bottom:-10px;height:150px;width:auto;max-width:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.st{background:var(--soft);border-radius:20px;padding:12px;min-width:0}
.st small{display:block;font-size:12px;font-weight:800}
.st b{display:block;font-size:18px;font-weight:800;letter-spacing:-.03em;margin-top:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st em{font-style:normal;font-size:11px;color:var(--muted);font-weight:600}
.rows{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:22px;padding:8px;text-align:left}
.row-f{width:66px;height:66px;border-radius:17px;background:var(--gm);overflow:hidden;flex:none;display:grid;place-items:end center}
.row-f img{width:90%;height:90%;object-fit:contain;object-position:bottom}
.row-t{flex:1;min-width:0}
.row-t b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em;margin:5px 0 2px}
.row-t small{display:block;font-size:12px;color:#5d5a66;line-height:1.35;font-weight:500}
.row .go{width:34px;height:34px;background:#fff;margin-right:4px}

/* fitur detail */
.hero{position:relative;height:300px;border-radius:30px;background:var(--gm);overflow:hidden}
.hero .hp{position:absolute;left:50%;bottom:-6px;height:270px;transform:translateX(-50%)}
.hero .hp img{height:100%;width:auto;max-width:none}
.hero .hi{position:absolute;right:16px;top:16px;width:64px;height:64px}
.hero .tag{position:absolute;left:16px;top:18px}
.hero .gchip{position:absolute;left:16px;bottom:16px;background:#fff}
.dt{font-size:36px;margin:20px 0 10px}
.lead{font-size:15px;line-height:1.55;color:#4a4754;font-weight:500}
.pts{display:grid;gap:8px;list-style:none}
.pts li{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:18px;padding:12px;font-size:14px;font-weight:700;line-height:1.35}
.pts li i{flex:none;width:32px;height:32px;border-radius:50%;background:var(--gm);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
.media-in{margin-top:14px;border-radius:22px;overflow:hidden;background:#000}
.media-in video,.media-in iframe{width:100%;aspect-ratio:16/9;display:block;border:0}
.react{background:var(--soft);border-radius:24px;padding:14px;margin-top:10px}
.react p{font-weight:800;font-size:15px;margin-bottom:12px}
.rx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rx button{border-radius:16px;background:#fff;padding:8px 4px 9px;font-size:12px;font-weight:800;border:2px solid transparent;transition:.2s}
.rx button img{width:44px;height:44px;margin:0 auto 6px;object-fit:contain}
.rx button.on{background:var(--gm);border-color:#121212;transform:translateY(-3px)}
.dnav{display:flex;gap:8px;margin-top:16px}
.dnav .nx{flex:1;min-width:0;height:58px;border-radius:99px;background:#121212;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 7px 0 20px;font-size:14px;text-align:left}
.dnav .nx span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnav .nx .go{width:44px;height:44px;background:#fff;color:#121212}
.dnav .rb{width:58px;height:58px}
.screen-in{animation:sIn .45s cubic-bezier(.2,1,.3,1) both}
@keyframes sIn{from{opacity:0;transform:translateX(36px)}}
.screen-back{animation:sBack .45s cubic-bezier(.2,1,.3,1) both}
@keyframes sBack{from{opacity:0;transform:translateX(-36px)}}

/* materi: boxes */
.dk-intro{position:relative;background:var(--gm);border-radius:26px;padding:16px 16px 16px;overflow:hidden;min-height:132px}
.dk-intro b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em;width:62%}
.dk-intro p{font-size:13px;font-weight:600;opacity:.75;width:60%;margin-top:6px;line-height:1.4}
.dk-intro img{position:absolute;right:4px;bottom:-12px;height:140px;width:auto;max-width:none}
.boxes{display:grid;gap:26px;margin-top:26px}
.mbox{position:relative;text-align:left;display:block;width:100%}
.mb-stack{position:relative;padding-top:14px}
.mb-stack i{position:absolute;left:8%;right:8%;top:0;height:40px;border-radius:16px;background:var(--gm);opacity:.55}
.mb-stack i+i{left:4%;right:4%;top:7px;opacity:.85}
.mb-face{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 10px 24px rgba(20,20,40,.14);transition:transform .2s}
.mbox:active .mb-face{transform:scale(.97)}
.mb-play{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:8px;background:#121212;color:#fff;border-radius:99px;padding:6px 14px 6px 6px;font-size:12px;font-weight:700}
.mb-play .go{width:28px;height:28px;background:#fff;color:#121212}
.mb-meta{display:flex;align-items:center;gap:10px;margin-top:10px;padding:0 4px}
.mb-meta b{font-size:16px;font-weight:800;flex:1;min-width:0;letter-spacing:-.01em}
.mb-meta small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}

/* deck overlay */
#deck-ov{position:fixed;inset:0;z-index:40;background:rgba(14,14,18,0);transition:background .45s;overflow:hidden}
#deck-ov.dim{background:rgba(14,14,18,.93)}
.dk-box{position:fixed;z-index:2;perspective:900px}
.dk-base{position:absolute;inset:0;border-radius:18px;background:linear-gradient(#2c2c35,#141418);box-shadow:inset 0 0 0 3px #ffffff14,0 30px 60px #0007;overflow:hidden}
.dk-base::after{content:"";position:absolute;inset:-10%;background:radial-gradient(circle at 50% 30%,var(--gm) 0,transparent 60%);opacity:0;transition:opacity .6s}
.dk-box.open .dk-base::after{opacity:1}
.dk-lid{position:absolute;inset:0;transform-origin:50% 0;transition:transform .75s cubic-bezier(.3,1.4,.5,1);border-radius:18px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.dk-box.open .dk-lid{transform:rotateX(-120deg)}
.dk-sw{position:fixed;left:0;right:0;z-index:3}
.dk-strip{display:flex;will-change:transform}
.dk-card{flex:none;border-radius:16px;overflow:hidden;box-shadow:0 18px 40px #0008;background:#222;transform-origin:50% 50%}
.dk-ptr{position:fixed;left:50%;z-index:4;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:18px solid #fff;filter:drop-shadow(0 4px 6px #0006)}
.dk-lbl{position:fixed;left:0;right:0;text-align:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:.02em;z-index:4;opacity:.85}
.dk-pick{position:fixed;z-index:5;perspective:1400px}
.dk-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,1.2,.4,1)}
.dk-pick.flip .dk-in{transform:rotateY(180deg)}
.dk-f,.dk-b{position:absolute;inset:0;border-radius:18px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 20px 50px #0009}
.dk-b{transform:rotateY(180deg);background:#000}
.dk-b video,.dk-b iframe{width:100%;height:100%;border:0;display:block;background:#000;object-fit:contain}
.dk-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--gm);color:#121212;text-align:center;padding:16px;font-weight:700;font-size:14px}
.dk-empty img{height:55%;width:auto}
.dk-x{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:8;width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 18px #0005}
.dk-x svg{width:18px;height:18px}
.dk-info{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-radius:28px 28px 0 0;overflow-y:auto;padding:18px 18px calc(30px + env(safe-area-inset-bottom));animation:sheet .55s cubic-bezier(.2,1,.3,1) both}
@keyframes sheet{from{transform:translateY(100%)}}
.dk-info>div{max-width:760px;margin:0 auto}
.vc{display:flex;gap:8px;margin:14px 0 4px}
.vc button{flex:1;height:46px;border-radius:14px;background:var(--soft);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.vc button.dark{background:#121212;color:#fff}
.vc svg{width:16px;height:16px}
.unmute{position:absolute;left:12px;top:12px;z-index:3;background:#fff;color:#121212;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:800;box-shadow:0 4px 14px #0005}


/* ---------- v3 additions ---------- */
#cover{position:fixed;inset:0;z-index:1;background:#0E0E11;overflow:hidden}
#c-bg{z-index:2}
.cs{z-index:3}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:0 0}
.abs{position:absolute}
.cv-pill{left:110px;top:96px;border:2px solid rgba(255,255,255,.28);color:#fff;border-radius:99px;padding:10px 22px;font-weight:700;font-size:18px;letter-spacing:.12em}
.cv-h{left:104px;top:186px;width:860px;color:#fff;font-size:124px}
.cv-p{left:110px;top:600px;width:640px;color:#9b98a6;font-size:28px;font-weight:500;line-height:1.4}
.cv-cta{left:110px;top:730px;display:flex;align-items:center;gap:30px}
.pbtn{display:inline-flex;align-items:center;gap:20px;background:#fff;color:#121212;border-radius:99px;padding:8px 8px 8px 30px;font-size:22px;font-weight:800;transition:transform .2s}
.pbtn:hover{transform:scale(1.04)}
.pbtn .go{width:56px;height:56px;background:#121212;color:#fff;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(5px)}}
.cv-key{color:#77737f;font-size:18px;display:flex;align-items:center;gap:10px;font-weight:500}
.key{display:inline-grid;place-items:center;min-width:42px;height:40px;border:1.5px solid #444;border-radius:9px;color:#ddd;font-size:18px;padding:0 10px}
.phone{width:400px;height:810px;border-radius:66px;background:#1d1d22;padding:13px;box-shadow:0 40px 80px rgba(0,0,0,.35),inset 0 0 0 2px #34343a}
.ph-s{position:relative;width:100%;height:100%;border-radius:54px;background:#fff;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:78px 28px 0}
.ph-s::before{content:"";position:absolute;top:14px;left:50%;width:118px;height:34px;border-radius:20px;background:#111;transform:translateX(-50%);z-index:2}
.ph-sb{position:absolute;top:22px;left:38px;right:38px;display:flex;justify-content:space-between;font-weight:800;font-size:16px}
.ph-kk{font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.ph-h{font-size:38px;text-align:center;margin:10px 0 20px}
.ph-qr{width:290px;height:290px;background:#fff;border-radius:32px;padding:20px;box-shadow:0 0 0 2px var(--line)}
.ph-qr svg{width:100%;height:100%}
.ph-logo{height:56px;margin-top:22px}
.ph-s .apile{--ph:160px}
.cv-ph{right:190px;top:45px}
.cv-ph .phone{transform:rotate(-4deg)}
.cv-f{width:120px;height:120px}

/* asset pile (learning illustrations) */
.apile{position:absolute;left:0;right:0;bottom:0;height:var(--ph,150px);overflow:hidden;pointer-events:none}
.ap{position:absolute;bottom:0;aspect-ratio:1;transform:translateY(130%)}
.in .ap,.apile.static .ap{animation:rise 1s cubic-bezier(.3,1.5,.5,1) forwards;animation-delay:calc(var(--d)*70ms + 250ms)}
.apile.static .ap{animation-duration:0s;animation-delay:0s}
@keyframes rise{to{transform:translateY(var(--y)) rotate(var(--r))}}

.hd-act{display:flex;gap:8px}
.hd-act button{height:44px;padding:0 16px;border-radius:99px;background:var(--soft);font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}
.hd-act svg{width:17px;height:17px}
.foot{margin:34px -18px -120px;height:260px}
.foot .apile{--ph:170px}
.cnt-pill{height:46px;padding:0 16px;border-radius:99px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.intro{position:relative;background:var(--gm);border-radius:26px;padding:18px;overflow:hidden;min-height:140px}
.intro b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em;width:64%}
.intro p{font-size:13px;font-weight:600;opacity:.78;width:62%;margin-top:6px;line-height:1.45}
.intro .ia{position:absolute;width:96px;height:96px}

/* scratch cards */
.scs{display:grid;gap:18px;margin-top:22px}
.sc{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:4/3;background:var(--gm);box-shadow:0 12px 28px rgba(20,20,40,.14);isolation:isolate}
.sc-u{position:absolute;inset:0;cursor:pointer}
.sc-u .th{height:100%;aspect-ratio:auto}
.sc-u .th>img{object-fit:cover}
.sc-lbl{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;display:flex;align-items:flex-end;gap:10px}
.sc-lbl b{flex:1;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.sc-lbl .go{width:40px;height:40px;background:#fff;color:#121212}
.sc canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .6s,transform .6s}
.sc.done canvas{opacity:0;transform:scale(1.08);pointer-events:none}
.sc-ctl{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:0 4px;font-size:12px;font-weight:700;color:var(--muted)}
.sc-ctl button{background:var(--soft);border-radius:99px;padding:6px 12px;font-weight:700;font-size:12px;color:var(--ink)}
.sc.done+.sc-ctl .quick{visibility:hidden}
.reset{height:46px;padding:0 14px;border-radius:99px;background:var(--soft);font-weight:800;font-size:13px;flex:none}

/* overlay (roulette + player) */
#deck-ov{z-index:40}
.dk-x{z-index:9}
.dk-info.desk{left:auto;bottom:24px;border-radius:28px;animation:sideIn .55s cubic-bezier(.2,1,.3,1) both}
@keyframes sideIn{from{transform:translateX(110%)}}
.dk-card{cursor:default}

/* QR overlay */
#qr-ov{position:fixed;inset:0;background:rgba(15,15,20,.6);backdrop-filter:blur(8px);z-index:60;display:grid;place-items:center;cursor:pointer}
#qr-ov .box{background:#fff;border-radius:44px;padding:30px;text-align:center;animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
#qr-ov .q{width:min(56vh,460px);height:min(56vh,460px);margin:0 auto}
#qr-ov .q svg{width:100%;height:100%}
#qr-ov h2{font-size:40px;margin-top:20px}
#qr-ov p{color:var(--muted);margin-top:8px;font-size:15px;word-break:break-all;max-width:480px;font-weight:600}

/* ---------- desktop (presenter) ---------- */
body.desk .wrap{max-width:1240px;padding:34px 56px 150px}
body.desk .hd>img{height:64px}
body.desk .h1{font-size:68px;margin:34px 0 22px;max-width:900px}
body.desk .mchip{font-size:15px;padding:6px 18px 6px 6px}
body.desk .mchip img{width:38px;height:38px}
body.desk .bento{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-top:14px}
body.desk .tile{min-height:360px;border-radius:40px;padding:28px}
body.desk .tl-h{font-size:20px;gap:10px}
body.desk .tl-h img{width:40px;height:40px}
body.desk .tl-n{font-size:150px}
body.desk .tl-s{font-size:20px}
body.desk .tl-c{font-size:16px;max-width:60%;padding:12px 16px;border-radius:18px}
body.desk .tl-g{height:300px;right:10px;top:40px}
body.desk .poll{border-radius:34px;padding:24px;margin-top:18px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 24px}
body.desk .poll-h{grid-column:1/-1;font-size:15px}
body.desk .pq{font-size:30px;margin:0}
body.desk .poll-b{min-width:360px}
body.desk .poll-b button{height:56px;font-size:17px}
body.desk .poll-done{grid-column:1/-1;font-size:20px}
body.desk .foot{margin:40px -56px -150px;height:320px}
body.desk .foot p{font-size:34px}
body.desk .foot .apile{--ph:230px}
body.desk .tb{margin-bottom:26px}
body.desk .tb-t b{font-size:26px}
body.desk .tb-t small{font-size:14px}
body.desk .intro{border-radius:36px;padding:30px 34px;min-height:180px}
body.desk .intro b{font-size:40px}
body.desk .intro p{font-size:17px;width:55%}
body.desk .intro .ia{width:140px;height:140px}
body.desk .scs{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px;margin-top:30px}
body.desk .sc{aspect-ratio:1;border-radius:34px}
body.desk .sc-lbl b{font-size:26px}
body.desk .boxes{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:30px}
body.desk .mb-meta b{font-size:19px}
body.desk #tabs button{width:70px;height:54px}
/* ====================== ADMIN ====================== */
#admin{position:fixed;inset:0;z-index:100;background:#F3F3F6;display:flex;flex-direction:column;font-size:14px}
.ad-top{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#121212;color:#fff}
.ad-top b{font-size:16px;font-weight:800}
.ad-st{font-size:12px;color:#9a97a5;font-weight:600}
.ad-act{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.ad-act button,.ad-act label{background:#2a2a30;color:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
.ad-act .pri{background:#fff;color:#121212}
.ad-body{flex:1;display:grid;grid-template-columns:minmax(420px,520px) 1fr;min-height:0}
.ad-form{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line)}
.ad-note{background:#FFF6D6;border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.5;font-weight:500}
.ad-note b{font-weight:800}
.ad-card{background:#fff;border-radius:18px;padding:14px;display:grid;gap:10px}
.ad-card h3{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
details.ad-d{background:#fff;border-radius:18px;padding:4px 14px;box-shadow:0 0 0 1px var(--line)}
details.ad-d[open]{padding-bottom:14px}
details.ad-d details.ad-d{background:var(--soft);box-shadow:none}
details.ad-d>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 0;cursor:pointer;font-weight:800}
details.ad-d>summary::-webkit-details-marker{display:none}
details.ad-d>summary::before{content:"▸";font-size:11px;transition:transform .2s}
details.ad-d[open]>summary::before{transform:rotate(90deg)}
summary .sm-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
summary .sm-g{width:26px;height:26px;border-radius:50%;background:var(--gm);overflow:hidden;flex:none}
summary .sm-g img{width:100%;height:100%;object-fit:cover}
.ad-ctl{display:flex;gap:4px}
.ad-ctl button{width:30px;height:30px;border-radius:9px;background:var(--soft);font-weight:800;font-size:13px}
details details .ad-ctl button{background:#fff}
.ad-ctl .del{color:#CB1F25}
.ad-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ad-in{display:grid;gap:10px}
label.f{display:grid;gap:5px;font-size:12px;font-weight:700;color:#55525e}
label.f.full{grid-column:1/-1}
label.f input,label.f textarea,label.f select{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:9px 11px;background:#fff;font-size:14px;font-weight:500;color:var(--ink);outline:none}
label.f textarea{resize:vertical;min-height:64px;line-height:1.45}
label.f input:focus,label.f textarea:focus,label.f select:focus{border-color:#121212}
.f-hint{font-size:11px;color:var(--muted);font-weight:500}
.ad-media{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start}
.ad-media .pv{border-radius:10px;overflow:hidden;background:#ddd}
.ad-btns{display:flex;gap:6px;flex-wrap:wrap}
.ad-btns label,.ad-btns button{background:#121212;color:#fff;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
.ad-btns .lt{background:#fff;color:#121212;box-shadow:0 0 0 1.5px var(--line)}
.ad-add{border:2px dashed #CFCDD8;border-radius:14px;padding:11px;font-weight:800;color:#55525e;width:100%}
.ad-add:hover{border-color:#121212;color:#121212}
.ad-prev{display:flex;flex-direction:column;min-width:0;min-height:0}
.ad-tabs{display:flex;gap:6px;padding:12px 16px;align-items:center}
.ad-tabs button{background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;box-shadow:0 0 0 1px var(--line)}
.ad-tabs button.on{background:#121212;color:#fff}
.ad-tabs span{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.ad-frame{flex:1;position:relative;overflow:hidden}
.ad-frame .fw{position:absolute;left:50%;top:50%;transform-origin:0 0;background:#000;overflow:hidden}
.ad-frame .fw.c{border-radius:44px;box-shadow:0 0 0 12px #1d1d22,0 30px 60px #0003}
.ad-frame .fw.p{border-radius:12px;box-shadow:0 20px 50px #0003}
.ad-frame iframe{width:100%;height:100%;border:0;display:block;background:#fff}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.ad-hint{font-size:11px;color:var(--muted);font-weight:500;grid-column:1/-1;margin-top:-4px}
</style>
</head>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open('slraker-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}))},

  async get(k){try{const db=await this.open();return await new Promise(res=>{const r=db.transaction('f').objectStore('f').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);});}catch(e){return null;}},

/* ---------- explosion ---------- */
function burst(layer,ox,oy,W,H,n,k){
  for(let i=0;i<n;i++){
    const badge=i%6===0, size=(badge?rnd(60,84):rnd(56,104))*k;
    const ang=rnd(0,Math.PI*2), sp=rnd(.25,.75);
    const dx=Math.cos(ang)*W*sp, peak=-rnd(.12,.42)*H+Math.sin(ang)*H*.18, r=rnd(-220,220);
    const el=document.createElement('div'); el.className='pt'; el.style.cssText=`width:${size}px;height:${size}px`;
    el.innerHTML=badge?iconI(GK[(i/6|0)%6]):asset(i*7,i);
    layer.appendChild(el);
    const b=`translate(${ox-size/2}px,${oy-size/2}px)`;
    el.animate([
      {transform:`${b} scale(.2) rotate(0deg)`,opacity:0,easing:'cubic-bezier(.15,.75,.35,1)'},
      {opacity:1,offset:.06},
      {transform:`${b} translate(${dx*.55}px,${peak}px) scale(1) rotate(${r*.4}deg)`,offset:.42,easing:'cubic-bezier(.5,0,.9,.55)'},
      {transform:`${b} translate(${dx}px,${H-oy+size*1.2}px) scale(1) rotate(${r}deg)`,opacity:1}
    ],{duration:rnd(1700,2500),delay:rnd(0,120),fill:'forwards'}).onfinish=()=>el.remove();
  }
}

async function runLogin(){
  const fu=$('#f-user'),fp=$('#f-pass'),btn=$('#btn-login'),hint=$('#login-hint');
  const vu=fu.querySelector('.val'),vp=fp.querySelector('.val'); let done=false,fired=false;
  btn.onclick=async()=>{if(fired)return;fired=true;done=true;
    vu.textContent=C().demoUser;vp.textContent='•'.repeat(C().demoPass.length);
    fu.classList.remove('focus');fp.classList.remove('focus');btn.classList.remove('glow');hint.style.opacity=0;
    const card=$('#login-card'); card.style.animation='none'; card.classList.add('shake'); await sleep(760);

    await sleep(450); $('#c-login').hidden=true; await sleep(350); startApp();};

function roulette(strip,cards,T,CW,step,ptr,lbl,items,dur,my){return new Promise(res=>{
  const cx=innerWidth/2, x0=cx-(1*step+CW/2), x1=cx-(T*step+CW/2), t0=performance.now(); let lastK=-1;
  const ease=t=>1-Math.pow(1-t,4);
  function f(now){
    if(my!==RUN)return res(false);
    const t=Math.min(1,(now-t0)/dur), x=x0+(x1-x0)*ease(t);
    strip.style.transform=`translateX(${x}px)`;
    const cen=(cx-x-CW/2)/step, k=Math.round(cen);
    if(k!==lastK){lastK=k;ptr.animate([{transform:'translateX(-50%) translateY(-6px)'},{transform:'translateX(-50%)'}],{duration:120});if(t>.55)lbl.textContent=items[mod(k,items.length)].title;}

  if(adminOn)return; adminOn=true;
  const a=$('#admin'); a.hidden=false;
  a.innerHTML=`<header class="ad-top"><b>Admin · Raker</b><span class="ad-st" id="ad-st">Draft tersimpan otomatis</span>
    <div class="ad-act"><button class="pri" data-top="export">⬇ Export index.html</button><button data-top="json">⬇ JSON</button><label>⬆ Import JSON<input type="file" accept=".json,application/json" hidden id="ad-imp"></label><button data-top="reset">Reset</button><button data-top="close">Tutup ✕</button></div></header>
    <div class="ad-body"><div class="ad-form" id="ad-form"></div>
    <div class="ad-prev"><div class="ad-tabs"><button data-pv="c">📱 HP</button><button data-pv="p">🖥 Desktop</button><button data-pv="cover">🎬 Cover</button><button data-pv="intro">🔒 Intro HP</button><button data-pv="r">↻</button><span>Preview pakai draft terbaru</span></div>
    <div class="ad-frame" id="ad-frame"><div class="fw"><iframe id="ad-if" title="Preview"></iframe></div></div></div></div>`;
  renderForm(); setPv(pvk);
  a.querySelector('.ad-act').onclick=e=>{const b=e.target.closest('[data-top]');if(!b)return;const t=b.dataset.top;
    if(t==='close')closeAdmin(); else if(t==='export')exportHTML(); else if(t==='json')download('raker-content.json',JSON.stringify(DATA,null,2),'application/json');
    else if(t==='reset'){if(b.dataset.sure){try{localStorage.removeItem(LS);}catch(e){}DATA=fixData(clone(DEFAULT_DATA));renderForm();changed(true);b.textContent='Reset';delete b.dataset.sure;}else{b.dataset.sure=1;b.textContent='Yakin reset? klik lagi';setTimeout(()=>{b.textContent='Reset';delete b.dataset.sure;},3000);}}};
  $('#ad-imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.cats||!d.config)throw 0;DATA=fixData(d);renderForm();changed(true);status('JSON berhasil di-import');}catch(_){status('File JSON tidak valid');}};
  a.querySelector('.ad-tabs').onclick=e=>{const b=e.target.closest('[data-pv]');if(!b)return;b.dataset.pv==='r'?setPv(pvk):setPv(b.dataset.pv);};
  addEventListener('resize',fitPv);
}
function closeAdmin(){adminOn=false;$('#admin').hidden=true;$('#admin').innerHTML='';removeEventListener('resize',fitPv);refreshView();}
function status(t){const s=$('#ad-st');if(s)s.textContent=t;}
function renderForm(){
  const f=$('#ad-form'); const st=f.scrollTop; f.innerHTML=adminForm(); f.scrollTop=st;
  f.querySelectorAll('details.ad-d').forEach(d=>d.addEventListener('toggle',()=>{d.open?openSet.add(d.dataset.k):openSet.delete(d.dataset.k);}));
  f.oninput=e=>{const el=e.target;if(!el.dataset.p)return;let v=el.value;if(el.hasAttribute('data-lines'))v=v.split('\n').map(s=>s.trim()).filter(Boolean);setP(el.dataset.p,v);
    if(el.tagName==='SELECT')renderForm(); changed();};
  f.onchange=async e=>{const el=e.target;
    if(el.dataset.img&&el.files[0]){status('Memproses gambar…');setP(el.dataset.img+'.thumb',await compress(el.files[0]));renderForm();changed(true);}
    if(el.dataset.vid&&el.files[0]){const file=el.files[0],key='media/'+file.name.replace(/\s+/g,'-');status('Menyimpan video…');
      try{await IDB.put(key,file);if(urlCache[key]){URL.revokeObjectURL(urlCache[key]);delete urlCache[key];}setP(el.dataset.vid+'.video',key);renderForm();changed(true);status('Video tersimpan di browser ini ('+key+')');}catch(_){status('Gagal menyimpan video');}}};
  f.onclick=e=>{const b=e.target.closest('[data-act]');if(!b)return;e.preventDefault();e.stopPropagation();
    const a=b.dataset.act,ci=+b.dataset.ci,ii=+b.dataset.ii,d=+b.dataset.d,cats=DATA.cats;
    const mv=(arr,i,dd)=>{const j=i+dd;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];};
    if(a==='mvc')mv(cats,ci,d);
    else if(a==='delc'){if(cats.length<=1)return status('Minimal 1 kategori');if(!b.dataset.sure){b.dataset.sure=1;b.textContent='?';return setTimeout(()=>{b.textContent='✕';delete b.dataset.sure;},2500);}cats.splice(ci,1);}
    else if(a==='addc'){cats.push({type:'fitur',no:String(cats.length+1).padStart(2,'0'),title:'Kategori baru',sub:'item',introTitle:'Judul intro',snippet:'',guardian:'indy',items:[newItem('fitur')]});openSet.add('c'+(cats.length-1));}
    else if(a==='mvi')mv(cats[ci].items,ii,d);
    else if(a==='deli'){if(cats[ci].items.length<=1)return status('Minimal 1 item per kategori');cats[ci].items.splice(ii,1);}
    else if(a==='addi'){cats[ci].items.push(newItem(cats[ci].type));openSet.add('c'+ci);openSet.add('c'+ci+'-'+(cats[ci].items.length-1));}
    else if(a==='clr')setP(b.dataset.p,'');
    renderForm();changed(true);};
}
function changed(now){clearTimeout(saveT);status('Menyimpan…');saveT=setTimeout(()=>{status(saveData()?'Draft tersimpan · preview diperbarui':'Gagal simpan — gambar terlalu banyak/besar?');},now?0:350);}
function setPv(k){pvk=k;document.querySelectorAll('.ad-tabs [data-pv]').forEach(b=>b.classList.toggle('on',b.dataset.pv===k));
  const fw=$('#ad-frame .fw');fw.className='fw '+(k==='c'||k==='intro'?'c':'p');$('#ad-if').src=location.href.split('#')[0]+'#preview-'+k;fitPv();}
function fitPv(){const fr=$('#ad-frame'),fw=$('#ad-frame .fw');if(!fr||!fw)return;const ph=pvk==='c'||pvk==='intro',w=ph?390:1440,h=ph?844:860;
  const s=Math.min((fr.clientWidth-60)/w,(fr.clientHeight-60)/h,1);fw.style.width=w+'px';fw.style.height=h+'px';fw.style.transform=`scale(${s}) translate(-50%,-50%)`;}
function compress(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const Wd=800,Ht=450,c=document.createElement('canvas');c.width=Wd;c.height=Ht;const x=c.getContext('2d');const s=Math.max(Wd/img.width,Ht/img.height),w=img.width*s,h=img.height*s;x.drawImage(img,(Wd-w)/2,(Ht-h)/2,w,h);URL.revokeObjectURL(img.src);res(c.toDataURL('image/jpeg',.8));};img.onerror=rej;img.src=URL.createObjectURL(file);});}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
async function exportHTML(){
  status('Menyiapkan file…');
  let src; try{const r=await fetch(location.href.split('#')[0],{cache:'no-store'});if(!r.ok)throw 0;src=await r.text();}catch(e){return status('Tidak bisa membaca file halaman. Buka lewat URL Vercel / server lokal, lalu coba lagi.');}
  const A='/*DATA_'+'START*/',B='/*DATA_'+'END*/',i=src.indexOf(A),j=src.indexOf(B);
  if(i<0||j<0)return status('Penanda data tidak ditemukan di file');
  const out=clone(DATA); out._v=Date.now();
  src=src.slice(0,i+A.length)+JSON.stringify(out,null,1).replace(/</g,'\\u003c')+src.slice(j);
  download('index.html',src,'text/html');
  const vids=DATA.cats.flatMap(c=>c.items.map(it=>it.video)).filter(v=>v&&!/^https?:/.test(v));
  status('index.html terunduh ✓'+(vids.length?` · upload juga ${vids.length} video ke folder media/`:''));
}

/* =====================================================================
   BOOT  —  #companion = HP peserta · #present = layar presenter
   ===================================================================== */
const HASH=location.hash.slice(1), PREVIEW=HASH.startsWith('preview-');
function refreshView(){
  if(!$('#cover').hidden)renderCover();
  if(appOn){buildTabs();$('#tabs').classList.remove('show');go(view.v,view.ci,true);}
}
addEventListener('storage',e=>{if(e.key!==LS)return;DATA=loadData();refreshView();});
addEventListener('keydown',e=>{
  if(adminOn)return; const t=e.target; if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return;
  if(!PREVIEW&&e.key&&e.key.length===1){kbuf=(kbuf+e.key.toLowerCase()).slice(-11);if(kbuf==='inigueadmin'){kbuf='';openAdmin();return;}}
  if(!$('#cover').hidden&&['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();explodeCover();return;}
  if(e.key==='Escape'){toggleQR(false);closeOv();}
  if(MODE==='p'&&appOn&&(e.key==='q'||e.key==='Q'))toggleQR();
  if(MODE==='p'&&(e.key==='f'||e.key==='F'))toggleFS();
},true);
function boot(){
  const h=HASH;
  MODE=(h==='companion'||h==='preview-c'||h==='preview-intro')?'c':(h==='present'||h==='preview-p'||h==='preview-cover')?'p':((innerWidth<760||(matchMedia('(pointer:coarse)').matches&&innerWidth<1000))?'c':'p');
  document.body.classList.toggle('desk',MODE==='p');
  if(h==='preview-c'||h==='preview-p'){$('#c-bg').classList.add('now');startApp();return;}
  if(MODE==='c'){startLock();return;}
  $('#cover').hidden=false; renderCover(); addEventListener('resize',fitCover);
}
boot();
</script>
